name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, what you got.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Blackstone version / commit
  - type: input
    id: client
    attributes:
      label: Minecraft client version and platform
  - type: dropdown
    id: os
    attributes:
      label: Server OS
      options: [Windows, Linux, Other]
  - type: textarea
    id: log
    attributes:
      label: Server log
      description: Run with log_level = "debug" if possible.
      render: text
