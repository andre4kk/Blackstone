# Configurazione di Blackstone. Copia questo file in `server.toml` (nella cartella da cui avvii il server):
# se `server.toml` manca, il server lo crea da solo con questi valori.

# Nome del mondo: i dati stanno in `worlds/<world>`.
world = "world"

# Seme del mondo. Se manca viene scelto a caso alla prima creazione e salvato in `level.dat`;
# per un mondo già esistente vale sempre il seme salvato. Valore massimo: 9223372036854775807.
# seed = 12345

# Programma del generatore. Su Windows il suffisso `.exe` si aggiunge da solo se manca.
generator = "generator/target/release/blackstone-gen"

# Raggio di chunk inviato a ogni giocatore.
view_distance = 6

# Porta TCP (signaling) e UDP (gioco).
port = 19132

# Se `true`, chi muore tiene l'inventario (niente oggetti a terra). Come la regola `keepInventory` del gioco.
keep_inventory = false

# Se `false`, i giocatori non si fanno danno tra loro (i bot si colpiscono comunque).
pvp = true

# Quanto parla la console: "warn" (solo avvisi ed errori), "info" (ingressi, chat, comandi, morti) o "debug"
# (anche i dettagli tecnici di rete e pacchetti). La variabile d'ambiente `BLACKSTONE_LOG` ha la precedenza.
log_level = "info"
