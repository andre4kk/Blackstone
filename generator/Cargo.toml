# Generatore di mondi Java Edition basato su SteelMC.
#
# Workspace separato dal server (MIT): questo crate dipende da steel-core (AGPL-3.0)
# e quindi è distribuito sotto AGPL-3.0-or-later (vedi LICENSE in questa cartella).
# Non va mai aggiunto ai membri del workspace principale.

[workspace]
resolver = "2"

[package]
name = "blackstone-gen"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false

[[bin]]
name = "blackstone-gen"
path = "src/main.rs"

[dependencies]
# Stessa revisione per tutti i crate di Steel.
steel-core = { git = "https://github.com/Steel-Foundation/SteelMC", rev = "62fd936e352c375bde611f419260397df0096bf8", features = ["region-generation"] }
steel-registry = { git = "https://github.com/Steel-Foundation/SteelMC", rev = "62fd936e352c375bde611f419260397df0096bf8" }
steel-utils = { git = "https://github.com/Steel-Foundation/SteelMC", rev = "62fd936e352c375bde611f419260397df0096bf8" }
steel-worldgen = { git = "https://github.com/Steel-Foundation/SteelMC", rev = "62fd936e352c375bde611f419260397df0096bf8" }

# Stesse versioni del workspace di Steel.
tokio = { version = "1.54.1", features = ["rt-multi-thread"] }
rayon = "1.12.0"
toml = "1.1.8"

# Protocollo con il server (MIT).
vgen = { path = "../crates/vgen" }
# NBT dei block entity Java (stessa versione di Steel).
simdnbt = "0.10.0"

[build-dependencies]
# Per leggere blocks.nbt (gzip) delle mappature Geyser.
flate2 = "1.1.10"

# Profili copiati dal Cargo.toml di Steel (la generazione in debug è troppo lenta).
[profile.release]
lto = true
codegen-units = 1
# Niente `panic = "abort"` (Steel lo usa): `serve` trasforma il panico di una richiesta in un errore senza chiudere il processo.

[profile.dev]
debug = 0

[profile.dev.package.steel-worldgen]
opt-level = 3
debug-assertions = false
overflow-checks = false

[profile.dev.package.steel-math]
opt-level = 3
debug-assertions = false
overflow-checks = false
