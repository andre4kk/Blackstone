[workspace]
resolver = "2"
members = ["crates/protocol", "crates/net", "crates/server"]
default-members = ["crates/server"] # `cargo run` e `cargo test` partono dal server

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
bedrock-protocol = { path = "crates/protocol" }
bedrock-net = { path = "crates/net" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }
str0m = { version = "0.25", default-features = false, features = ["rust-crypto"] }
p384 = { version = "0.13", features = ["ecdsa", "sha384"] }
base64 = "0.22"
serde_json = "1"
getrandom = "0.3"
miniz_oxide = "0.8"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
