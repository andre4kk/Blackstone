[workspace]
resolver = "2"
members = ["crates/protocol", "crates/net", "crates/server", "crates/vgen"]
default-members = ["crates/server"] # `cargo run` e `cargo test` partono dal server

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
bedrock-protocol = { path = "crates/protocol" }
bedrock-net = { path = "crates/net" }
vgen = { path = "crates/vgen" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "process", "signal"] }
str0m = { version = "0.25", default-features = false, features = ["rust-crypto"] }
p384 = { version = "0.13", features = ["ecdsa", "sha384"] }
base64 = "0.22"
serde_json = "1"
getrandom = "0.3"
miniz_oxide = "0.8"
md-5 = "0.10"
rusty-leveldb = "4.0.2"
toml = "1"
serde = { version = "1", features = ["derive"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"

# `cargo run` in dev: le dipendenze (cifratura WebRTC, compressione, LevelDB) sono lente a opt-level 0 e il client lo sente;
# il nostro codice resta a opt-level 0 e debuggabile.
[profile.dev.package."*"]
opt-level = 2
